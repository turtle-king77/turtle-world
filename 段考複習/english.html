function App() {
  const [view, setView] = useState('home');
  const [section, setSection] = useState(null);
  const [scores, setScores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('eng-scores-v2') || '{}'); } catch { return {}; }
  });
  useEffect(() => { localStorage.setItem('eng-scores-v2', JSON.stringify(scores)); }, [scores]);
  const goHome = () => { setView('home'); setSection(null); };
  if (view === 'home') return <Home scores={scores} onSelect={(s) => { setSection(s); setView('study'); }} />;
  if (section === 'flashcards') return <FlashcardMode onBack={goHome} />;
  if (section === 'vocabulary') return <VocabQuiz onBack={goHome} onFinish={(s,t) => setScores(p => ({...p, vocab: [...(p.vocab||[]), {s,t,d:Date.now()}]}))} />;
  if (section === 'cloze') return <ClozeTest onBack={goHome} onFinish={(s,t) => setScores(p => ({...p, cloze: [...(p.cloze||[]), {s,t,d:Date.now()}]}))} />;
  if (section === 'fillin') return <FillInTest onBack={goHome} onFinish={(s,t) => setScores(p => ({...p, fillin: [...(p.fillin||[]), {s,t,d:Date.now()}]}))} />;
  if (section === 'reading') return <ReadingTest onBack={goHome} onFinish={(s,t) => setScores(p => ({...p, reading: [...(p.reading||[]), {s,t,d:Date.now()}]}))} />;
  return <Home scores={scores} onSelect={(s) => { setSection(s); setView('study'); }} />;
}

function FlashcardMode({ onBack }) {
  const cards = DATA.flashcards.cards;
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState([]);
  const [unknown, setUnknown] = useState([]);
  if (idx >= cards.length) {
    return <ResultScreen title="閃卡完成！" icon="📇" correct={known.length} total={cards.length}
      wrongItems={unknown.map(i => cards[i].q)} onRetry={() => { setIdx(0); setFlipped(false); setKnown([]); setUnknown([]); }} onBack={onBack} />;
  }
  return (
    <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 p-4 md:p-8">
      <div className="max-w-lg mx-auto">
        <Header onBack={onBack} title="📇 頂標詞彙閃卡" progress={idx} total={cards.length} color="teal" />
        <div className={`flip-card cursor-pointer ${flipped ? 'flipped' : ''} mt-6`} onClick={() => setFlipped(!flipped)} style={{ height: '360px' }}>
          <div className="flip-card-inner relative w-full h-full">
            <div className="flip-card-front absolute w-full h-full bg-white rounded-2xl shadow-lg border-2 border-teal-100 flex items-center justify-center p-8">
              <div className="text-center">
                <div className="text-xs text-teal-400 mb-6">點擊翻牌</div>
                <div className="text-2xl font-bold text-gray-800 eng whitespace-pre-line">{cards[idx].q}</div>
              </div>
            </div>
            <div className="flip-card-back absolute w-full h-full bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl shadow-lg flex items-center justify-center p-6 overflow-auto">
              <div className="text-white whitespace-pre-line text-sm leading-relaxed">{cards[idx].a}</div>
            </div>
          </div>
        </div>
        <div className="flex gap-3 mt-6">
          <button onClick={() => { setUnknown([...unknown, idx]); setFlipped(false); setTimeout(() => setIdx(i=>i+1), 150); }}
            className="flex-1 py-4 bg-red-100 text-red-600 rounded-xl font-bold text-lg hover:bg-red-200">✗ 不熟</button>
          <button onClick={() => { setKnown([...known, idx]); setFlipped(false); setTimeout(() => setIdx(i=>i+1), 150); }}
            className="flex-1 py-4 bg-green-100 text-green-600 rounded-xl font-bold text-lg hover:bg-green-200">✓ 會了</button>
        </div>
      </div>
    </div>
  );
}

function VocabQuiz({ onBack, onFinish }) {
  const qs = useMemo(() => [...DATA.vocabulary.questions].sort(() => Math.random() - 0.5), []);
  const [idx, setIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);
  const [wrongs, setWrongs] = useState([]);
  if (idx >= qs.length) { onFinish(score, qs.length); return <ResultScreen title="詞彙題完成！" icon="📝" correct={score} total={qs.length} wrongItems={wrongs} onRetry={() => { setIdx(0); setSel(null); setScore(0); setWrongs([]); }} onBack={onBack} />; }
  const q = qs[idx];
  const handleSel = (i) => { if (sel !== null) return; setSel(i); if (i === q.answer) setScore(s=>s+1); else setWrongs(w=>[...w, q.options[q.answer] + ' — ' + (q.tags||[]).join(', ')]); };
  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 p-4 md:p-8">
      <div className="max-w-lg mx-auto">
        <Header onBack={onBack} title="📝 詞彙題（頂標）" progress={idx} total={qs.length} color="blue" />
        <div className="bg-white rounded-2xl shadow-lg border p-6 mt-6 fade-in">
          {q.tags && <div className="flex gap-2 mb-3">{q.tags.map((t,i) => <span key={i} className="px-2 py-0.5 bg-indigo-100 text-indigo-600 text-xs rounded-full font-medium">{t}</span>)}</div>}
          <div className="text-lg font-medium text-gray-800 eng leading-relaxed mb-6">{q.q}</div>
          <Options options={q.options} selected={sel} answer={q.answer} onSelect={handleSel} />
        </div>
        {sel !== null && (<><ExplainBox correct={sel===q.answer} text={q.explain} /><button onClick={() => { setSel(null); setIdx(i=>i+1); }} className="w-full mt-4 py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700">{idx+1>=qs.length?'查看結果 →':'下一題 →'}</button></>)}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// 📖 綜合測驗
// ═══════════════════════════════════════════════════
function ClozeTest({ onBack, onFinish }) {
  const passages = DATA.cloze.questions;
  const [pIdx, setPIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);
  const [total, setTotal] = useState(0);
  const [wrongs, setWrongs] = useState([]);
  const [done, setDone] = useState(false);
  if (done) { onFinish(score, total); return <ResultScreen title="綜合測驗完成！" icon="📖" correct={score} total={total} wrongItems={wrongs} onRetry={() => { setPIdx(0); setQIdx(0); setSel(null); setScore(0); setTotal(0); setWrongs([]); setDone(false); }} onBack={onBack} />; }
  const p = passages[pIdx]; const q = p.questions[qIdx];
  const allTotal = passages.reduce((s,p)=>s+p.questions.length,0);
  const currentNum = passages.slice(0,pIdx).reduce((s,p)=>s+p.questions.length,0)+qIdx;
  const handleSel = (i) => { if(sel!==null)return; setSel(i); setTotal(t=>t+1); if(i===q.answer)setScore(s=>s+1); else setWrongs(w=>[...w,`${q.id}: ${q.options[q.answer]}`]); };
  const handleNext = () => { setSel(null); if(qIdx+1<p.questions.length)setQIdx(qi=>qi+1); else if(pIdx+1<passages.length){setPIdx(pi=>pi+1);setQIdx(0);} else setDone(true); };
  const hp = p.passage.replace(new RegExp(`__${q.id}__`,'g'),`【 ${q.id} 】`);
  return (
    <div className="min-h-screen bg-gradient-to-br from-purple-50 to-violet-50 p-4 md:p-8">
      <div className="max-w-2xl mx-auto">
        <Header onBack={onBack} title="📖 綜合測驗（頂標）" progress={currentNum} total={allTotal} color="purple" />
        <div className="bg-white rounded-2xl shadow-lg border p-6 mt-6">
          <div className="text-sm text-purple-400 mb-2">第 {pIdx+1} 篇</div>
          <div className="eng text-gray-700 leading-relaxed whitespace-pre-line text-sm bg-gray-50 rounded-xl p-4 mb-6">{hp}</div>
          <div className="border-t pt-4">
            <div className="font-bold text-purple-600 mb-3">▸ {q.id}</div>
            <Options options={q.options} selected={sel} answer={q.answer} onSelect={handleSel} />
          </div>
        </div>
        {sel!==null&&(<><ExplainBox correct={sel===q.answer} text={q.explain} /><button onClick={handleNext} className="w-full mt-4 py-4 bg-purple-600 text-white rounded-xl font-bold text-lg hover:bg-purple-700">{(qIdx+1>=p.questions.length&&pIdx+1>=passages.length)?'查看結果 →':'下一題 →'}</button></>)}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// 🧩 文意選填
// ═══════════════════════════════════════════════════
function FillInTest({ onBack, onFinish }) {
  const data = DATA.fillin.questions[0];
  const [current, setCurrent] = useState(1);
  const [answers, setAnswers] = useState({});
  const [showResult, setShowResult] = useState(false);
  const [sel, setSel] = useState(null);
  const usedOptions = Object.values(answers);
  const availableOptions = data.options.map((opt,i)=>({text:opt,idx:i,used:usedOptions.includes(i)}));
  if (showResult) {
    const correct = Object.entries(answers).filter(([k,v])=>data.answers[k]===v).length;
    onFinish(correct, data.blanks);
    const wrongs = Object.entries(answers).filter(([k,v])=>data.answers[k]!==v).map(([k])=>`第${k}格：正確 ${data.options[data.answers[k]]}`);
    return <ResultScreen title="文意選填完成！" icon="🧩" correct={correct} total={data.blanks} wrongItems={wrongs}
      extraContent={<div className="bg-gray-50 rounded-xl p-4 text-left text-xs mt-4 max-h-64 overflow-auto"><div className="font-bold mb-2">📖 詳解：</div>{Object.entries(data.answers).map(([k,v])=>(<div key={k} className={`mb-2 ${answers[k]===v?'text-green-600':'text-red-600'}`}><strong>第{k}格</strong>：{data.options[v]}<br/><span className="text-gray-500">{data.explains[k]}</span></div>))}</div>}
      onRetry={()=>{setCurrent(1);setAnswers({});setShowResult(false);setSel(null);}} onBack={onBack} />;
  }
  const handleSelect = (i) => { if(availableOptions[i].used)return; setSel(i); };
  const handleConfirm = () => { if(sel===null)return; setAnswers({...answers,[current]:sel}); setSel(null); if(current<data.blanks)setCurrent(c=>c+1); else setShowResult(true); };
  const pw = data.passage.replace(/__(\d+)__/g,(_,n)=>{if(answers[n]!==undefined)return`[${data.options[answers[n]]}]`;if(parseInt(n)===current)return`【＿${n}＿】`;return`＿${n}＿`;});
  return (
    <div className="min-h-screen bg-gradient-to-br from-amber-50 to-orange-50 p-4 md:p-8">
      <div className="max-w-2xl mx-auto">
        <Header onBack={onBack} title="🧩 文意選填（頂標）" progress={current-1} total={data.blanks} color="amber" />
        <div className="bg-white rounded-2xl shadow-lg border p-6 mt-6">
          <div className="eng text-gray-700 leading-relaxed whitespace-pre-line text-sm bg-gray-50 rounded-xl p-4 mb-4">{pw}</div>
          <div className="font-bold text-amber-700 mb-3">▸ 第 {current} 格：</div>
          <div className="grid grid-cols-2 gap-2">
            {availableOptions.map((opt,i)=>(<button key={i} onClick={()=>handleSelect(i)} disabled={opt.used}
              className={`text-left p-3 rounded-xl border-2 text-sm eng transition ${opt.used?'bg-gray-100 border-gray-200 text-gray-300 cursor-not-allowed line-through':sel===i?'bg-amber-100 border-amber-400 text-amber-800 font-bold':'bg-white border-gray-200 hover:border-amber-300 cursor-pointer'}`}>{opt.text}</button>))}
          </div>
          {sel!==null&&<button onClick={handleConfirm} className="w-full mt-4 py-3 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600">確認 →</button>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// 📚 閱讀測驗
// ═══════════════════════════════════════════════════
function ReadingTest({ onBack, onFinish }) {
  const passages = DATA.reading.questions;
  const [pIdx, setPIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [sel, setSel] = useState(null);
  const [score, setScore] = useState(0);
  const [total, setTotal] = useState(0);
  const [wrongs, setWrongs] = useState([]);
  const [done, setDone] = useState(false);
  if(done){onFinish(score,total);return <ResultScreen title="閱讀測驗完成！" icon="📚" correct={score} total={total} wrongItems={wrongs} onRetry={()=>{setPIdx(0);setQIdx(0);setSel(null);setScore(0);setTotal(0);setWrongs([]);setDone(false);}} onBack={onBack}/>;}
  const p=passages[pIdx];const q=p.questions[qIdx];
  const allTotal=passages.reduce((s,p)=>s+p.questions.length,0);
  const currentNum=passages.slice(0,pIdx).reduce((s,p)=>s+p.questions.length,0)+qIdx;
  const handleSel=(i)=>{if(sel!==null)return;setSel(i);setTotal(t=>t+1);if(i===q.answer)setScore(s=>s+1);else setWrongs(w=>[...w,q.q.substring(0,40)+'...']);};
  const handleNext=()=>{setSel(null);if(qIdx+1<p.questions.length)setQIdx(qi=>qi+1);else if(pIdx+1<passages.length){setPIdx(pi=>pi+1);setQIdx(0);}else setDone(true);};
  return (
    <div className="min-h-screen bg-gradient-to-br from-rose-50 to-pink-50 p-4 md:p-8">
      <div className="max-w-2xl mx-auto">
        <Header onBack={onBack} title="📚 閱讀測驗（頂標）" progress={currentNum} total={allTotal} color="rose" />
        <div className="bg-white rounded-2xl shadow-lg border p-6 mt-6">
          <div className="text-sm text-rose-400 mb-2">{p.title} — 題 {qIdx+1}/{p.questions.length}</div>
          <details className="mb-4" open>
            <summary className="cursor-pointer text-rose-600 font-bold text-sm mb-2">📄 文章（點擊收合）</summary>
            <div className="eng text-gray-700 leading-relaxed whitespace-pre-line text-sm bg-gray-50 rounded-xl p-4">{p.passage}</div>
          </details>
          <div className="border-t pt-4">
            <div className="font-bold text-gray-800 eng mb-4">{q.q}</div>
            <Options options={q.options} selected={sel} answer={q.answer} onSelect={handleSel} />
          </div>
        </div>
        {sel!==null&&(<><ExplainBox correct={sel===q.answer} text={q.explain} /><button onClick={handleNext} className="w-full mt-4 py-4 bg-rose-600 text-white rounded-xl font-bold text-lg hover:bg-rose-700">{(qIdx+1>=p.questions.length&&pIdx+1>=passages.length)?'查看結果 →':'下一題 →'}</button></>)}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
// 🧱 共用元件
// ═══════════════════════════════════════════════════
function Header({onBack,title,progress,total,color}) {
  const colors = {teal:'#14b8a6',blue:'#4f46e5',purple:'#7c3aed',amber:'#d97706',rose:'#e11d48'};
  return (<><div className="flex items-center justify-between mb-2"><button onClick={onBack} className="text-gray-500 hover:text-gray-700 font-medium text-sm">← 返回</button><div className="text-sm text-gray-500 font-medium">{title}</div><div className="text-sm font-bold text-gray-700">{progress}/{total}</div></div><div className="w-full bg-gray-200 rounded-full h-2"><div className="h-2 rounded-full transition-all duration-300" style={{width:`${(progress/total)*100}%`,backgroundColor:colors[color]||'#3b82f6'}}></div></div></>);
}
function Options({options,selected,answer,onSelect}) {
  return (<div className="space-y-3">{options.map((opt,i)=>{let cls='bg-gray-50 border-gray-200 hover:bg-blue-50 hover:border-blue-300 cursor-pointer';if(selected!==null){if(i===answer)cls='bg-green-100 border-green-400 text-green-800 pop';else if(i===selected)cls='bg-red-100 border-red-400 text-red-800 shake';else cls='bg-gray-50 border-gray-200 opacity-40';}return(<button key={i} onClick={()=>onSelect(i)} className={`w-full text-left p-4 rounded-xl border-2 transition eng text-sm ${cls}`}><span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-white border text-xs mr-3 flex-shrink-0">{String.fromCharCode(65+i)}</span>{opt}</button>);})}</div>);
}
function ExplainBox({correct,text}) {
  return (<div className={`mt-4 p-5 rounded-2xl border-2 fade-in ${correct?'bg-green-50 border-green-200':'bg-red-50 border-red-200'}`}><div className={`font-bold mb-2 ${correct?'text-green-700':'text-red-700'}`}>{correct?'✅ 正確！':'❌ 錯了！看解析 ↓'}</div><div className="text-sm text-gray-700 whitespace-pre-line leading-relaxed">{text}</div></div>);
}
function ResultScreen({title,icon,correct,total,wrongItems=[],extraContent,onRetry,onBack}) {
  const pct=Math.round(correct/total*100);
  return (<div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8 flex items-center justify-center"><div className="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full text-center fade-in"><div className="text-5xl mb-3">{pct>=80?'🌟':pct>=60?'👍':'💪'}</div><h2 className="text-2xl font-bold mb-2">{icon} {title}</h2><div className={`text-5xl font-black my-4 ${pct>=80?'text-green-500':pct>=60?'text-orange-500':'text-red-500'}`}>{pct}%</div><div className="text-gray-500 mb-2">{correct} / {total} 答對</div><div className="text-sm text-gray-400 mb-4">{pct>=90?'頂標穩了 🏆':pct>=80?'很接近了，再練幾次！':pct>=60?'繼續加強易混淆詞！':'別灰心，仔細看解析再來一次'}</div>{wrongItems.length>0&&<div className="bg-red-50 rounded-xl p-4 mb-4 text-left max-h-48 overflow-auto"><div className="font-bold text-sm text-red-600 mb-2">❌ 需加強：</div>{wrongItems.map((item,i)=><div key={i} className="text-xs text-gray-600 mb-1">• {item}</div>)}</div>}{extraContent}<div className="space-y-2 mt-4"><button onClick={onRetry} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">🔄 再做一次</button><button onClick={onBack} className="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200">← 返回</button></div></div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
