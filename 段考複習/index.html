function shuffleArray(items) {
  const arr = [...items];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function loadScores() {
  try {
    const parsed = JSON.parse(localStorage.getItem(SCORE_KEY) || '{}');
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch {

  }
}

function getScopedQuizzes(subjectKey, scopeIndex) {
  const all = SUBJECTS[subjectKey]?.quizzes || [];
  const scopedMatrix = QUIZ_SCOPE_INDEX_B2[subjectKey];
  if (!scopedMatrix || scopeIndex < 0 || !scopedMatrix[scopeIndex]) return all;
  const pick = [...new Set(scopedMatrix[scopeIndex])]
    .filter(i => Number.isInteger(i) && i >= 0 && i < all.length)
    .map(i => all[i]);
  return pick.length > 0 ? pick : all;
}

function getAvailableDifficultyOptions(subjectKey) {
  if (OLYMPIAD_SUBJECT_KEYS.has(subjectKey)) return DIFFICULTY_OPTIONS;
  return DIFFICULTY_OPTIONS.filter(opt => !OLYMPIAD_DIFFICULTY_KEYS.has(opt.key));
}

function normalizeDifficultyForSubject(subjectKey, difficultyKey) {
  if (!OLYMPIAD_SUBJECT_KEYS.has(subjectKey) && OLYMPIAD_DIFFICULTY_KEYS.has(difficultyKey)) {
    return 'top';
  }
  return difficultyKey;
}

function splitIndicesIntoStages(total) {
  const all = Array.from({ length: total }, (_, i) => i);
  if (all.length === 0) return [[], [], []];
  const base = Math.floor(total / 3);
  const remain = total % 3;
  const sizes = [base + (remain > 0 ? 1 : 0), base + (remain > 1 ? 1 : 0), base];
  const buckets = [];
  let ptr = 0;
  for (const size of sizes) {
    buckets.push(all.slice(ptr, ptr + size));
    ptr += size;
  }
  return buckets;
}

function difficultyForQuiz(subjectKey, idx, total) {
  if (total <= 0) return 'mid';
  const ratio = (idx + 1) / total;

  if (OLYMPIAD_SUBJECT_KEYS.has(subjectKey)) {
    if (ratio <= 0.10) return 'base';
    if (ratio <= 0.20) return 'back';
    if (ratio <= 0.30) return 'mid';
    if (ratio <= 0.40) return 'front';
    if (ratio <= 0.50) return 'top';
    if (ratio <= 0.62) return 'ao_beginner';
    if (ratio <= 0.74) return 'ao_review';
    if (ratio <= 0.84) return 'ao_bronze';
    if (ratio <= 0.93) return 'ao_silver';
    return 'ao_gold';
  }

  if (ratio <= 0.20) return 'base';
  if (ratio <= 0.40) return 'back';
  if (ratio <= 0.60) return 'mid';
  if (ratio <= 0.80) return 'front';
  return 'top';
}

function buildQuizPool(subjectKey, examType, stageKey, difficultyKey) {
  const normalizedDifficulty = normalizeDifficultyForSubject(subjectKey, difficultyKey);
  const allQuizzes = SUBJECTS[subjectKey]?.quizzes || [];
  const total = allQuizzes.length;
  const allIndices = Array.from({ length: total }, (_, i) => i);
  if (allIndices.length === 0) return [];

  const stageIdx = STAGE_TO_SCOPE_INDEX[stageKey] ?? 0;
  const stageBuckets = splitIndicesIntoStages(total);
  let baseIndices = [];

  if (examType === 'midterm') {
    const scopedMatrix = QUIZ_SCOPE_INDEX_B2[subjectKey];
    const scoped = scopedMatrix?.[stageIdx];
    if (Array.isArray(scoped) && scoped.length > 0) {
      baseIndices = [...new Set(scoped)].filter(i => i >= 0 && i < total);
    } else {
      baseIndices = stageBuckets[stageIdx] || allIndices;
    }
  } else {
    baseIndices = stageBuckets[stageIdx] || allIndices;
  }

  if (baseIndices.length === 0) baseIndices = allIndices;

  let picked = baseIndices;
  if (normalizedDifficulty !== 'all') {
    const target = DIFFICULTY_RANK[normalizedDifficulty] ?? 3;
    let exact = baseIndices.filter(i => DIFFICULTY_RANK[difficultyForQuiz(subjectKey, i, total)] === target);

    if (exact.length < 3) {
      exact = baseIndices.filter(i => DIFFICULTY_RANK[difficultyForQuiz(subjectKey, i, total)] <= target);
    }
    if (
      exact.length === 0 &&
      OLYMPIAD_SUBJECT_KEYS.has(subjectKey) &&
      DIFFICULTY_RANK[normalizedDifficulty] >= DIFFICULTY_RANK.ao_beginner
    ) {
      exact = baseIndices.filter(i => DIFFICULTY_RANK[difficultyForQuiz(subjectKey, i, total)] >= DIFFICULTY_RANK.top);
    }
    if (exact.length > 0) picked = exact;
  }

  return picked.map((idx) => ({
    idx,
    difficulty: difficultyForQuiz(subjectKey, idx, total),
    quiz: allQuizzes[idx],
  }));
}

    });
  };

  const daysLeft = useMemo(() => Math.max(0, Math.ceil((EXAM_DATE - new Date()) / DAY_MS)), []);
  const openStudy = (s, m) => { setSubject(s); setMode(m); setView('study'); };

  if (view === 'home') return <Home daysLeft={daysLeft} scores={scores} onSelect={openStudy} />;
  if (view === 'study' && mode === 'flashcard') return <Flashcards subject={subject} onBack={() => setView('home')} />;
  if (view === 'study' && mode === 'quiz') return <Quiz subject={subject} onBack={() => setView('home')} onFinish={updateScore} />;
  if (view === 'study' && mode === 'summary') return <Summary subject={subject} onBack={() => setView('home')} />;
  return <Home daysLeft={daysLeft} scores={scores} onSelect={openStudy} />;
}

function Flashcards({ subject, onBack }) {
  const subj = SUBJECTS[subject];
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState([]);
  const [unknown, setUnknown] = useState([]);
  const cards = subj.flashcards;

  const handleKnow = () => {
    setKnown(prev => (prev.includes(index) ? prev : [...prev, index]));
    setUnknown(prev => prev.filter(i => i !== index));
    setFlipped(false);
    setTimeout(() => setIndex(i => Math.min(i + 1, cards.length)), 120);
  };

  const handleDontKnow = () => {
    setUnknown(prev => (prev.includes(index) ? prev : [...prev, index]));
    setKnown(prev => prev.filter(i => i !== index));
    setFlipped(false);
    setTimeout(() => setIndex(i => Math.min(i + 1, cards.length)), 120);
  };

  if (index >= cards.length) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8 flex items-center justify-center">
        <div className="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full text-center fade-in">
          <div className="text-5xl mb-4">🎉</div>
          <h2 className="text-2xl font-bold mb-4">{subj.name} 閃卡完成！</h2>
          <div className="grid grid-cols-2 gap-4 mb-6">
            <div className="bg-green-50 rounded-xl p-4">
              <div className="text-3xl font-bold text-green-600">{known.length}</div>
              <div className="text-sm text-gray-500">已熟悉 ✓</div>
            </div>
            <div className="bg-red-50 rounded-xl p-4">
              <div className="text-3xl font-bold text-red-600">{unknown.length}</div>
              <div className="text-sm text-gray-500">需加強 ✗</div>
            </div>
          </div>
          {unknown.length > 0 && (
            <div className="bg-yellow-50 rounded-xl p-4 mb-4 text-left">
              <div className="font-bold text-sm mb-2">📌 需要加強的觀念：</div>
              {unknown.map(i => (
                <div key={i} className="text-sm text-gray-600 mb-1">• {cards[i].q}</div>
              ))}
            </div>
          )}
          <div className="space-y-2">
            <button onClick={() => { setIndex(0); setFlipped(false); setKnown([]); setUnknown([]); }}
              className="w-full py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600">
              🔄 再來一輪
            </button>
            <button onClick={onBack} className="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200">
              ← 回首頁
            </button>
          </div>
        </div>
      </div>
    );
  }

  const card = cards[index];
  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8">
      <div className="max-w-lg mx-auto">
        <div className="flex items-center justify-between mb-6">
          <button onClick={onBack} className="text-gray-500 hover:text-gray-700 font-medium">← 回首頁</button>
          <div className="text-sm text-gray-500">{subj.icon} {subj.name} 閃卡</div>
          <div className="text-sm font-bold">{index + 1} / {cards.length}</div>
        </div>

        {/* Progress Bar */}
        <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
          <div className="bg-blue-500 h-2 rounded-full transition-all" style={{ width: `${(index / cards.length) * 100}%` }}></div>
        </div>

        {/* Card */}
        <div className={`flip-card cursor-pointer ${flipped ? 'flipped' : ''}`} onClick={() => setFlipped(!flipped)} style={{ height: '320px' }}>
          <div className="flip-card-inner relative w-full h-full">
            <div className="flip-card-front absolute w-full h-full bg-white rounded-2xl shadow-lg border-2 border-blue-100 flex items-center justify-center p-8">
              <div className="text-center">
                <div className="text-xs text-blue-400 mb-4">Q 問題（點擊翻牌）</div>
                <div className="text-xl font-bold text-gray-800">{card.q}</div>
              </div>
            </div>
            <div className="flip-card-back absolute w-full h-full bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl shadow-lg flex items-center justify-center p-8">
              <div className="text-center">
                <div className="text-xs text-blue-100 mb-4">A 答案</div>
                <div className="text-lg font-medium text-white whitespace-pre-line">{card.a}</div>
              </div>
            </div>
          </div>
        </div>

        {/* Buttons */}
        <div className="flex gap-3 mt-6">
          <button onClick={handleDontKnow} className="flex-1 py-4 bg-red-100 text-red-600 rounded-xl font-bold text-lg hover:bg-red-200 transition">
            ✗ 不熟
          </button>
          <button onClick={handleKnow} className="flex-1 py-4 bg-green-100 text-green-600 rounded-xl font-bold text-lg hover:bg-green-200 transition">
            ✓ 會了
          </button>

      </div>

function Quiz({ subject, onBack, onFinish }) {
  const subj = SUBJECTS[subject];
  const scopeRows = EXAM_SCOPE_B2[subject] || [];
  const [examType, setExamType] = useState('midterm');
  const [stageKey, setStageKey] = useState('g10');
  const [difficultyKey, setDifficultyKey] = useState('top');
  const difficultyOptions = useMemo(() => getAvailableDifficultyOptions(subject), [subject]);
  const scopedPool = useMemo(
    () => buildQuizPool(subject, examType, stageKey, difficultyKey).map(item => item.quiz),
    [subject, examType, stageKey, difficultyKey]
  );
  const quizzes = useMemo(() => shuffleArray(scopedPool), [scopedPool]);
  const [index, setIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showExplain, setShowExplain] = useState(false);
  const [answers, setAnswers] = useState([]);
  const correctCount = useMemo(() => answers.reduce((sum, a) => sum + (a.isCorrect ? 1 : 0), 0), [answers]);
  const wrongAnswers = useMemo(() => answers.filter(a => !a.isCorrect), [answers]);

  useEffect(() => {
    setExamType('midterm');
    setStageKey('g10');
    setDifficultyKey('top');
  }, [subject]);

  useEffect(() => {
    if (!difficultyOptions.some(opt => opt.key === difficultyKey)) {
      setDifficultyKey('top');
    }
  }, [difficultyOptions, difficultyKey]);

  useEffect(() => {
    setIndex(0);
    setSelected(null);
    setShowExplain(false);
    setAnswers([]);
  }, [subject, examType, stageKey, difficultyKey]);

  const stageIdx = STAGE_TO_SCOPE_INDEX[stageKey] ?? 0;
  const stageLabel = STAGE_OPTIONS.find(s => s.key === stageKey)?.label || '高一';
  const examTypeLabel = EXAM_TYPE_OPTIONS.find(e => e.key === examType)?.label || '段考';
  const difficultyLabel = difficultyOptions.find(d => d.key === difficultyKey)?.label || '頂標';
  const activeScope = examType === 'midterm' ? scopeRows[stageIdx] : null;

  const handleSelect = (i) => {
    if (!quizzes[index]) return;
    if (selected !== null) return;
    setSelected(i);
    setShowExplain(true);
    const correct = i === quizzes[index].answer;
    setAnswers(prev => [...prev, { q: quizzes[index].q, selected: i, correct: quizzes[index].answer, isCorrect: correct }]);
  };

  const handleNext = () => {
    if (index + 1 >= quizzes.length) {
      onFinish(subject, correctCount, quizzes.length);
    }
    setSelected(null);
    setShowExplain(false);
    setIndex(i => i + 1);
  };

  if (quizzes.length === 0) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8 flex items-center justify-center">
        <div className="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full text-center fade-in">
          <div className="text-5xl mb-4">📭</div>
          <h2 className="text-2xl font-bold mb-2">{subj.name} 題庫暫無資料</h2>
          <div className="text-sm text-gray-500 mb-4">請切換階段、考試類型或難易度。</div>
          <button onClick={onBack} className="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200">
            ← 回首頁
          </button>
        </div>
      </div>
    );
  }

  if (index >= quizzes.length) {
    const pct = Math.round(correctCount / Math.max(1, quizzes.length) * 100);
    const placement = getPlacementAnalysis(examType, pct, subject);
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8 flex items-center justify-center">
        <div className="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full text-center fade-in">
          <div className="text-5xl mb-4">{pct >= 80 ? '🌟' : pct >= 60 ? '👍' : '💪'}</div>
          <h2 className="text-2xl font-bold mb-2">{subj.name} 測驗結果</h2>
          <div className="text-xs text-gray-500 mb-2">{examTypeLabel}｜{stageLabel}｜{difficultyLabel}</div>
          {activeScope && (
            <div className="text-xs text-gray-500 mb-2">範圍：{activeScope.exam} · {activeScope.scope}</div>
          )}
          <div className={`text-5xl font-black my-4 ${pct >= 80 ? 'text-green-500' : pct >= 60 ? 'text-orange-500' : 'text-red-500'}`}>
            {pct}%
          </div>
          <div className="text-gray-500 mb-4">{correctCount} / {quizzes.length} 題答對</div>
          <div className="bg-blue-50 rounded-xl p-3 mb-4 text-left">
            <div className="font-bold text-sm text-blue-700 mb-1">{placement.title}</div>
            <div className="text-sm text-gray-700">{placement.body}</div>
          </div>

          {wrongAnswers.length > 0 && (
            <div className="bg-red-50 rounded-xl p-4 mb-4 text-left">
              <div className="font-bold text-sm mb-2 text-red-600">❌ 答錯的題目：</div>
              {wrongAnswers.map((a, i) => (
                <div key={i} className="text-sm text-gray-600 mb-1">• {a.q}</div>
              ))}
            </div>
          )}

          <div className="space-y-2">
            <button onClick={() => { setIndex(0); setSelected(null); setShowExplain(false); setAnswers([]); }}
              className="w-full py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600">
              🔄 重新測驗（同範圍）
            </button>
            <button onClick={onBack} className="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200">
              ← 回首頁
            </button>
          </div>
        </div>
      </div>
    );
  }

  const quiz = quizzes[index];
  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-4 md:p-8">
      <div className="max-w-lg mx-auto">
        <div className="flex items-center justify-between mb-6">
          <button onClick={onBack} className="text-gray-500 hover:text-gray-700 font-medium">← 回首頁</button>
          <div className="text-sm text-gray-500">{subj.icon} {subj.name} 測驗</div>
          <div className="text-sm font-bold">{index + 1} / {quizzes.length}</div>
        </div>

        <div className="bg-white rounded-2xl border p-4 mb-4 fade-in">
          <div className="text-xs font-bold text-indigo-700 mb-2">108課綱分層出題</div>
          <div className="text-[11px] text-gray-500 mb-2">學科 × 階段 × 考試類型 × 難易度</div>

          <div className="grid grid-cols-2 gap-2 mb-2">
            {EXAM_TYPE_OPTIONS.map((opt) => (
              <button
                key={opt.key}
                onClick={() => setExamType(opt.key)}
                className={`py-2 rounded-lg text-xs font-bold border transition ${examType === opt.key ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 text-gray-600 border-gray-200 hover:border-indigo-300 hover:text-indigo-700'}`}>
                {opt.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-3 gap-2 mb-2">
            {STAGE_OPTIONS.map((opt) => (
              <button
                key={opt.key}
                onClick={() => setStageKey(opt.key)}
                className={`py-2 rounded-lg text-xs font-bold border transition ${stageKey === opt.key ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-gray-50 text-gray-600 border-gray-200 hover:border-emerald-300 hover:text-emerald-700'}`}>
                {opt.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-5 gap-2">
            {difficultyOptions.map((opt) => (
              <button
                key={opt.key}
                onClick={() => setDifficultyKey(opt.key)}
                className={`py-2 rounded-lg text-xs font-bold border transition ${difficultyKey === opt.key ? 'bg-orange-500 text-white border-orange-500' : 'bg-gray-50 text-gray-600 border-gray-200 hover:border-orange-300 hover:text-orange-700'}`}>
                {opt.label}
              </button>
            ))}
          </div>

          <div className="mt-3 text-xs text-gray-600">
            目前：{examTypeLabel}｜{stageLabel}｜{difficultyLabel}｜題數 {quizzes.length}
          </div>
          {activeScope && (
            <div className="mt-1 text-xs text-gray-600">範圍：{activeScope.exam} · {activeScope.scope}</div>
          )}
          {!activeScope && examType === 'bigexam' && (
            <div className="mt-1 text-xs text-gray-600">範圍：學測/分科素養整合（校系導向）</div>
          )}
        </div>

        <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
          <div className="bg-purple-500 h-2 rounded-full transition-all" style={{ width: `${((index) / quizzes.length) * 100}%` }}></div>
        </div>

        <div className="bg-white rounded-2xl shadow-lg border p-6 mb-4 fade-in">
          <div className="text-lg font-bold text-gray-800 mb-6">{quiz.q}</div>
          <div className="space-y-3">
            {quiz.options.map((opt, i) => {
              let cls = 'bg-gray-50 border-gray-200 hover:bg-blue-50 hover:border-blue-300 cursor-pointer';
              if (selected !== null) {
                if (i === quiz.answer) cls = 'bg-green-100 border-green-400 text-green-800';
                else if (i === selected && i !== quiz.answer) cls = 'bg-red-100 border-red-400 text-red-800 shake';
                else cls = 'bg-gray-50 border-gray-200 opacity-50';
              }
              return (
                <button key={i} onClick={() => handleSelect(i)}
                  className={`w-full text-left p-4 rounded-xl border-2 transition font-medium ${cls}`}>
                  <span className="inline-block w-8 h-8 rounded-full bg-white border text-center leading-8 mr-3 text-sm">
                    {String.fromCharCode(65 + i)}
                  </span>
                  {opt}
                </button>
              );
            })}
          </div>
        </div>

        {showExplain && (
          <div className="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-5 mb-4 fade-in">
            <div className="font-bold text-yellow-800 mb-2">
              {selected === quiz.answer ? '✅ 答對了！' : '❌ 答錯了！'}
            </div>
            <div className="text-sm text-gray-700 whitespace-pre-line">{quiz.explain}</div>
          </div>
        )}

        {showExplain && (
          <button onClick={handleNext}
            className="w-full py-4 bg-blue-500 text-white rounded-xl font-bold text-lg hover:bg-blue-600 transition">
            {index + 1 >= quizzes.length ? '查看結果 →' : '下一題 →'}
          </button>
        )}
      </div>
    </div>
  );
}

function Summary({ subject, onBack }) {
  const subj = SUBJECTS[subject];

  const summaries = {
    math: [
      { title: '第1章：數列與級數', points: [
        '等差數列：每項差固定值 d，aₙ = a₁ + (n-1)d',
        '等差級數求和：Sₙ = n(a₁ + aₙ)/2',
        '等比數列：每項乘固定值 r，aₙ = a₁·rⁿ⁻¹',
